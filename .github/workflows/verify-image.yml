name: Verify BuildKit Image

on:
  push:
    tags:
      - "v*-bc.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "BoringCache BuildKit tag, for example v0.30.0-bc.10"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: buildkit-verify-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/boringcache/buildkit
  COSIGN_CERTIFICATE_IDENTITY: "https://github.com/boringcache/buildkit/.github/workflows/sign-image.yml@refs/heads/main"
  COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"

jobs:
  verify:
    name: Verify Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout verification helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: verifier
          persist-credentials: false

      - name: Resolve tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-bc\.[0-9]+$ ]]; then
            echo "BuildKit image tag must look like vX.Y.Z-bc.N, got ${tag}" >&2
            exit 1
          fi

          image="${IMAGE_REPOSITORY}:${tag}"
          token="$(
            curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:boringcache/buildkit:pull" |
              jq -r '.token'
          )"
          headers="$(
            curl -fsSI \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/boringcache/buildkit/manifests/${tag}" |
              tr -d '\r'
          )"
          digest="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "docker-content-digest:" { print $2; exit }')"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve immutable digest for ${image}" >&2
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "image=${image}"
            echo "digest=${digest}"
            echo "digest_ref=${IMAGE_REPOSITORY}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          path: release-metadata
          persist-credentials: false

      - name: Verify signed release tag
        working-directory: release-metadata
        run: |
          set -euo pipefail
          bash ../verifier/.github/scripts/verify-release-tag \
            "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.image }}" \
            "${{ steps.release.outputs.digest }}"

      - name: Inspect image
        run: |
          set -euo pipefail
          image="${{ steps.release.outputs.digest_ref }}"
          docker buildx imagetools inspect "${image}"
          bash verifier/.github/scripts/verify-buildkit-attestations \
            "${image}" \
            "${IMAGE_REPOSITORY}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.digest_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload vulnerability scan
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.digest_ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${COSIGN_CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            "${{ steps.release.outputs.digest_ref }}"
