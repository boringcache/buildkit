name: Verify BuildKit Image

on:
  push:
    tags:
      - "v*-bc.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "BoringCache BuildKit tag, for example v0.30.0-bc.1"
        required: true
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: buildkit-verify-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/boringcache/buildkit
  COSIGN_CERTIFICATE_IDENTITY: "https://github.com/boringcache/buildkit/.github/workflows/sign-image.yml@refs/heads/main"
  COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"

jobs:
  verify:
    name: Verify Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Resolve tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-bc\.[0-9]+$ ]]; then
            echo "BuildKit image tag must look like vX.Y.Z-bc.N, got ${tag}" >&2
            exit 1
          fi

          image="${IMAGE_REPOSITORY}:${tag}"
          token="$(
            curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:boringcache/buildkit:pull" |
              jq -r '.token'
          )"
          headers="$(
            curl -fsSI \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/boringcache/buildkit/manifests/${tag}" |
              tr -d '\r'
          )"
          digest="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "docker-content-digest:" { print $2; exit }')"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve immutable digest for ${image}" >&2
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "image=${image}"
            echo "digest=${digest}"
            echo "digest_ref=${IMAGE_REPOSITORY}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release tag
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$(git cat-file -t "${tag}" 2>/dev/null || true)" != "tag" ]]; then
            echo "Release tag ${tag} must be an annotated signed tag object." >&2
            exit 1
          fi

          allowed_signers="${RUNNER_TEMP}/release_allowed_signers"
          printf '%s\n' \
            'gaurav@gauravtiwari.co.uk ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILVC6w5HTvW0TZwuN0/J3axNnAfNclejNgpCWs0b2KAM' \
            'gaurav@gauravtiwari.co.uk ssh-rsa ' \
            > "${allowed_signers}"

          git \
            -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="${allowed_signers}" \
            tag -v "${tag}"

      - name: Inspect image
        run: |
          set -euo pipefail
          image="${{ steps.release.outputs.digest_ref }}"
          docker buildx imagetools inspect "${image}"
          bash .github/scripts/verify-buildkit-attestations \
            "${image}" \
            "${IMAGE_REPOSITORY}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.digest_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload vulnerability scan
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.digest_ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Verify signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${COSIGN_CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            "${{ steps.release.outputs.digest_ref }}"
