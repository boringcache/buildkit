name: Sign BuildKit Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "BoringCache BuildKit tag, for example v0.30.0-bc.10"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  id-token: write
  packages: write
  security-events: write

concurrency:
  group: buildkit-sign-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/boringcache/buildkit
  BC_COSIGN_CERTIFICATE_IDENTITY: "https://github.com/boringcache/buildkit/.github/workflows/sign-image.yml@refs/heads/main"
  BC_COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"

jobs:
  sign:
    name: Sign Image
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Checkout verification helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: verifier
          persist-credentials: false

      - name: Resolve image
        id: release
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-bc\.[0-9]+$ ]]; then
            echo "BuildKit image tag must look like vX.Y.Z-bc.N, got ${tag}" >&2
            exit 1
          fi

          image="${IMAGE_REPOSITORY}:${tag}"
          token="$(
            curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:boringcache/buildkit:pull" |
              jq -r '.token'
          )"
          headers="$(
            curl -fsSI \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/boringcache/buildkit/manifests/${tag}" |
              tr -d '\r'
          )"
          digest="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "docker-content-digest:" { print $2; exit }')"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve immutable digest for ${image}" >&2
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "image=${image}"
            echo "digest=${digest}"
            echo "digest_ref=${IMAGE_REPOSITORY}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout signed release metadata
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          path: release-metadata
          persist-credentials: false

      - name: Verify signed release tag
        working-directory: release-metadata
        run: |
          set -euo pipefail
          bash ../verifier/.github/scripts/verify-release-tag \
            "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.image }}" \
            "${{ steps.release.outputs.digest }}"

      - name: Inspect image and attestations
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.release.outputs.digest_ref }}"
          bash verifier/.github/scripts/verify-buildkit-attestations \
            "${{ steps.release.outputs.digest_ref }}" \
            "${IMAGE_REPOSITORY}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.digest_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload vulnerability scan
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.digest_ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: cosign sign --yes "${{ steps.release.outputs.digest_ref }}"

      - name: Verify signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${BC_COSIGN_CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${BC_COSIGN_OIDC_ISSUER}" \
            "${{ steps.release.outputs.digest_ref }}"

      - name: Promote managed channel tags
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          base="${tag%-bc.*}"
          channel="${base}-bc"
          digest="${{ steps.release.outputs.digest }}"

          docker buildx imagetools create \
            -t "${IMAGE_REPOSITORY}:${channel}" \
            -t "${IMAGE_REPOSITORY}:latest" \
            "${{ steps.release.outputs.digest_ref }}"

          for promoted_tag in "${channel}" latest; do
            promoted_digest="$(
              docker buildx imagetools inspect \
                "${IMAGE_REPOSITORY}:${promoted_tag}" \
                --format '{{json .Manifest.Digest}}' |
                jq -r .
            )"
            if [[ "${promoted_digest}" != "${digest}" ]]; then
              echo "Promoted ${IMAGE_REPOSITORY}:${promoted_tag} resolved ${promoted_digest}, expected ${digest}." >&2
              exit 1
            fi
          done

      - name: Dispatch public verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run verify-image.yml \
            --repo boringcache/buildkit \
            --ref main \
            -f "tag=${{ steps.release.outputs.tag }}"
