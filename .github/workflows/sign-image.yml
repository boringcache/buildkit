name: Sign BuildKit Image
run-name: Sign BuildKit Image / ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "BoringCache BuildKit tag, for example v0.33.0-bc.4"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  packages: write
  security-events: write

concurrency:
  group: buildkit-sign
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/boringcache/buildkit
  BC_COSIGN_PUBLIC_KEY: verifier/.github/release-cosign-v1.pub

jobs:
  sign:
    name: Sign Image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Checkout verification helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: verifier
          persist-credentials: false

      - name: Resolve image
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-bc\.[0-9]+$ ]]; then
            echo "BuildKit image tag must look like vX.Y.Z-bc.N, got ${tag}" >&2
            exit 1
          fi

          image="${IMAGE_REPOSITORY}:${tag}"
          token="$(
            curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:boringcache/buildkit:pull" |
              jq -r '.token'
          )"
          headers="$(
            curl -fsSI \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/boringcache/buildkit/manifests/${tag}" |
              tr -d '\r'
          )"
          digest="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "docker-content-digest:" { print $2; exit }')"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve immutable digest for ${image}" >&2
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "image=${image}"
            echo "digest=${digest}"
            echo "digest_ref=${IMAGE_REPOSITORY}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout signed release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          path: release-metadata
          persist-credentials: false

      - name: Verify signed release tag
        working-directory: release-metadata
        run: |
          set -euo pipefail
          bash ../verifier/.github/scripts/verify-release-tag \
            "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.image }}" \
            "${{ steps.release.outputs.digest }}"

      - name: Inspect image and attestations
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.release.outputs.digest_ref }}"
          bash verifier/.github/scripts/verify-buildkit-attestations \
            "${{ steps.release.outputs.digest_ref }}" \
            "${IMAGE_REPOSITORY}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.digest_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload vulnerability scan
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.digest_ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PACKAGE_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PACKAGE_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_RELEASE_PASSWORD }}
          COSIGN_RELEASE_PRIVATE_KEY: ${{ secrets.COSIGN_RELEASE_PRIVATE_KEY }}
          DIGEST_REF: ${{ steps.release.outputs.digest_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${COSIGN_RELEASE_PRIVATE_KEY}" || -z "${COSIGN_PASSWORD}" ]]; then
            echo "The protected Cosign release key and password are required." >&2
            exit 1
          fi
          signing_key="${RUNNER_TEMP}/release-cosign-v1.key"
          printf '%s\n' "${COSIGN_RELEASE_PRIVATE_KEY}" > "${signing_key}"
          chmod 600 "${signing_key}"
          trap 'rm -f "${signing_key}"' EXIT
          state="$(ruby verifier/.github/scripts/image-signature-state "${DIGEST_REF}" "${BC_COSIGN_PUBLIC_KEY}")"
          if [[ "${state}" == absent ]]; then cosign sign --yes --key "${signing_key}" "${DIGEST_REF}"; fi

      - name: Verify signature
        run: |
          set -euo pipefail
          cosign verify \
            --key "${BC_COSIGN_PUBLIC_KEY}" \
            "${{ steps.release.outputs.digest_ref }}"

      - name: Promote managed channel tags
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          base="${tag%-bc.*}"
          channel="${base}-bc"
          digest="${{ steps.release.outputs.digest }}"

          newest="$(git -C release-metadata tag --list 'v*-bc.*' --sort=-version:refname | sed -n '1p')"
          if [[ "${newest}" != "${tag}" ]]; then
            echo "A newer release tag exists; this retry leaves managed channels unchanged."
            exit 0
          fi

          for promoted_tag in "${channel}" latest; do
            current="$(ruby verifier/.github/scripts/image-state "${IMAGE_REPOSITORY}:${promoted_tag}")"
            if [[ "${current}" != "${digest}" ]]; then
              docker buildx imagetools create --prefer-index=false \
                -t "${IMAGE_REPOSITORY}:${promoted_tag}" "${{ steps.release.outputs.digest_ref }}"
            fi
            promoted_digest="$(
              docker buildx imagetools inspect \
                "${IMAGE_REPOSITORY}:${promoted_tag}" \
                --format '{{json .Manifest.Digest}}' |
                jq -r .
            )"
            if [[ "${promoted_digest}" != "${digest}" ]]; then
              echo "Promoted ${IMAGE_REPOSITORY}:${promoted_tag} resolved ${promoted_digest}, expected ${digest}." >&2
              exit 1
            fi
          done
