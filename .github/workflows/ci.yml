name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: buildkit-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/boringcache/buildkit
  BUILDKIT_IMAGE_TAG: v0.34.0-bc.1
  COSIGN_PUBLIC_KEY: .github/release-cosign-v1.pub

jobs:
  trust:
    name: Trust Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell helpers
        run: |
          set -euo pipefail
          bash -n .github/scripts/verify-buildkit-attestations
          bash -n .github/scripts/verify-release-tag

      - name: Check public repo guardrails
        run: |
          set -euo pipefail

          test -s .github/SECURITY.md
          grep -Fq 'security@boringcache.com' .github/SECURITY.md

          if grep -R -nE '^[[:space:]]*uses: actions/checkout@' .github/workflows |
            grep -vE '^[^:]+:[0-9]+:[[:space:]]*uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1$'; then
            echo "Found stale actions/checkout pin." >&2
            exit 1
          fi

          if grep -R -nE '^[[:space:]]*uses: sigstore/cosign-installer@' .github/workflows |
            grep -vE '^[^:]+:[0-9]+:[[:space:]]*uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2$'; then
            echo "Found stale sigstore/cosign-installer pin." >&2
            exit 1
          fi

      - name: Resolve promoted image digest
        id: image
        run: |
          set -euo pipefail
          digest="$(
            docker buildx imagetools inspect \
              "${IMAGE_REPOSITORY}:${BUILDKIT_IMAGE_TAG}" \
              --format '{{json .Manifest.Digest}}' |
              jq -r .
          )"

          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve immutable digest for ${IMAGE_REPOSITORY}:${BUILDKIT_IMAGE_TAG}" >&2
            exit 1
          fi

          echo "digest_ref=${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify promoted image attestations
        run: |
          .github/scripts/verify-buildkit-attestations \
            "${{ steps.image.outputs.digest_ref }}" \
            "${IMAGE_REPOSITORY}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify promoted image signature
        run: |
          cosign verify \
            --key "${COSIGN_PUBLIC_KEY}" \
            "${{ steps.image.outputs.digest_ref }}"
